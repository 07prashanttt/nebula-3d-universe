<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Real Earth & Solar System 3D</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="hud">
    <h1>REAL EARTH & PLANETS 3D</h1>
    <p id="statusText">Drag to Rotate • Scroll to Zoom • Click or Pick a Planet</p>
    <div class="actions">
      <button id="pauseBtn" onclick="togglePause()">Pause Orbit</button>
      <button onclick="resetView()">Reset Camera</button>
    </div>
  </div>

  <div class="dock" id="planetDock"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="script.js"></script>
</body>
</html>
